plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bizimperia.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bizimperia.game'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // Гра (HTML/JS/CSS) береться прямо з теки business-manager у корені репозиторію.
    sourceSets {
        main {
            assets.srcDirs = ['../../business-manager']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
